name: checks

# The steps of the check `ci / ci`, called by ci.yml: type check, lint, unit
# tests, build, and the checks on the built site (docs/getting-started.md).

on:
  workflow_call:

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm test
        env:
          ASTRO_TELEMETRY_DISABLED: 1
