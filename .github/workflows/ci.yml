name: ci

# The check every PR needs before it can merge: `pnpm test`, accessibility
# (pa11y-ci) and Lighthouse CI, on every commit of a PR and every push to main. Deploys nothing. The steps are in checks.yml, so the
# check keeps the name `ci / ci` that the ruleset of main requires.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
